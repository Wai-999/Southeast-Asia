services:
  - type: web
    name: sea-change-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements-mvp.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: CLAUDE_MODEL
        value: claude-haiku-4-5
      - key: ANTHROPIC_API_KEY
        sync: false

  - type: web
    name: sea-change-web
    runtime: node
    plan: free
    rootDir: frontend
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_VERSION
        value: 20.15.1
      - key: API_UPSTREAM_HOSTPORT
        fromService:
          type: web
          name: sea-change-api
          property: hostport
