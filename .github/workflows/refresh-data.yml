name: "Refresh Official Data (WB + Comtrade)"

# ──────────────────────────────────────────────────────────────────────────
# Runs every Monday at 04:00 UTC to fetch updated World Bank indicators
# and UN Comtrade trade flows, process them, regenerate alerts, and commit
# the updated JSON files back so the next Render deploy picks them up.
#
# World Bank and Comtrade data is annual — weekly is more than sufficient.
# Running on Mondays means fresh numbers are ready at the start of the week.
#
# Manual trigger: GitHub → Actions → "Refresh Official Data" → Run workflow
# ──────────────────────────────────────────────────────────────────────────

on:
  schedule:
    - cron: "0 4 * * 1"    # every Monday at 04:00 UTC

  workflow_dispatch:
    inputs:
      source:
        description: "Which source to refresh"
        required: false
        default: "data"
        type: choice
        options:
          - "data"        # both WB and Comtrade
          - "worldbank"   # World Bank only
          - "comtrade"    # Comtrade only
      force_refresh:
        description: "Force re-fetch (bypass cache)"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]

permissions:
  contents: write

jobs:
  refresh-worldbank:
    name: "Fetch World Bank indicators"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: |
      github.event_name == 'schedule' ||
      github.event.inputs.source == 'data' ||
      github.event.inputs.source == 'worldbank'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install Python dependencies
        run: pip install -r pipeline/requirements.txt

      - name: "Fetch World Bank indicators"
        working-directory: pipeline
        run: |
          ARGS="--refresh"   # always force on weekly run
          python fetch_worldbank.py $ARGS

      - name: Upload WB raw output
        uses: actions/upload-artifact@v4
        with:
          name: worldbank-raw
          path: pipeline/data/processed/worldbank_indicators.json
          retention-days: 7

  refresh-comtrade:
    name: "Fetch UN Comtrade trade flows"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: |
      github.event_name == 'schedule' ||
      github.event.inputs.source == 'data' ||
      github.event.inputs.source == 'comtrade'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install Python dependencies
        run: pip install -r pipeline/requirements.txt

      - name: "Fetch UN Comtrade trade flows"
        working-directory: pipeline
        env:
          # Optional: if COMTRADE_SUBSCRIPTION_KEY is set in repo secrets,
          # the script automatically uses the Plus API for full coverage.
          COMTRADE_SUBSCRIPTION_KEY: ${{ secrets.COMTRADE_SUBSCRIPTION_KEY }}
        run: python fetch_comtrade.py --refresh
        continue-on-error: true   # curated fallback data is fine

      - name: Upload Comtrade raw output
        uses: actions/upload-artifact@v4
        with:
          name: comtrade-raw
          path: pipeline/data/processed/trade_flows.json
          retention-days: 7

  process-and-commit:
    name: "Process → alerts → commit"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [refresh-worldbank, refresh-comtrade]
    # Run even if fetch jobs failed (use cached data)
    if: always()

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install Python dependencies
        run: pip install -r pipeline/requirements.txt

      # Download fresh data from fetch jobs (if they succeeded)
      - name: Download World Bank output
        uses: actions/download-artifact@v4
        with:
          name: worldbank-raw
          path: pipeline/data/processed/
        continue-on-error: true

      - name: Download Comtrade output
        uses: actions/download-artifact@v4
        with:
          name: comtrade-raw
          path: pipeline/data/processed/
        continue-on-error: true

      - name: "Process indicators"
        working-directory: pipeline
        run: python process_indicators.py

      - name: "Generate pattern alerts"
        working-directory: pipeline
        run: python generate_alerts.py

      - name: "Update refresh log"
        working-directory: pipeline
        run: python -c "from refresh_log import bootstrap_from_processed_files; bootstrap_from_processed_files()"

      - name: "Show data freshness"
        working-directory: pipeline
        run: python refresh_log.py

      - name: Commit updated data files
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add \
            pipeline/data/processed/worldbank_indicators.json \
            pipeline/data/processed/trade_flows.json \
            pipeline/data/processed/indicators_dashboard.json \
            pipeline/data/processed/alerts.json \
            pipeline/data/processed/refresh_log.json

          if git diff --cached --quiet; then
            echo "No data changes — nothing to commit."
          else
            git commit -m "chore(data): refresh WB+Comtrade $(date -u '+%Y-%m-%d %H:%M UTC') [skip ci]"
            git push
            echo "✓ Data files committed and pushed."
          fi
