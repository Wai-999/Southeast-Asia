name: "Refresh News Data (GDELT)"

# ──────────────────────────────────────────────────────────────────────────
# Runs every 6 hours to fetch the latest GDELT news articles,
# process them, regenerate alerts, and commit the updated JSON files
# back to the repository so the next Render deploy picks them up.
#
# Manual trigger: GitHub → Actions → "Refresh News Data" → Run workflow
# ──────────────────────────────────────────────────────────────────────────

on:
  schedule:
    - cron: "0 */6 * * *"    # every 6 hours  (00:00, 06:00, 12:00, 18:00 UTC)

  workflow_dispatch:          # manual trigger from GitHub Actions UI
    inputs:
      force_refresh:
        description: "Force re-fetch (ignore today's cached raw files)"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]

permissions:
  contents: write             # needed to commit the updated data files

jobs:
  refresh-news:
    name: "Fetch GDELT → process → alerts"
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ── 2. Python setup ──────────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install Python dependencies
        run: pip install -r pipeline/requirements.txt

      # ── 3. Fetch GDELT news ───────────────────────────────────────────────
      - name: "Fetch GDELT news"
        working-directory: pipeline
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.force_refresh }}" = "true" ]; then
            ARGS="--refresh"
          fi
          python fetch_gdelt_news.py $ARGS
        continue-on-error: true   # rate-limit should not fail the whole workflow

      # ── 4. Process news & generate alerts ─────────────────────────────────
      - name: "Process news signals"
        working-directory: pipeline
        run: python process_news.py

      - name: "Generate pattern alerts"
        working-directory: pipeline
        run: python generate_alerts.py

      # ── 5. Update refresh log ─────────────────────────────────────────────
      - name: "Update refresh log"
        working-directory: pipeline
        run: python -c "from refresh_log import bootstrap_from_processed_files; bootstrap_from_processed_files()"

      # ── 6. Show what changed ──────────────────────────────────────────────
      - name: "Show data freshness"
        working-directory: pipeline
        run: python refresh_log.py

      # ── 7. Commit updated data back to repo ──────────────────────────────
      # The Next.js app imports JSON at build time, so committing here
      # ensures the next Render deploy (triggered by this push) gets fresh data.
      - name: Commit updated data files
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add \
            pipeline/data/processed/news_signals.json \
            pipeline/data/processed/news_dashboard.json \
            pipeline/data/processed/alerts.json \
            pipeline/data/processed/refresh_log.json

          # Only commit if something actually changed
          if git diff --cached --quiet; then
            echo "No data changes — nothing to commit."
          else
            git commit -m "chore(data): refresh GDELT news $(date -u '+%Y-%m-%d %H:%M UTC') [skip ci]"
            git push
            echo "✓ Data files committed and pushed."
          fi
